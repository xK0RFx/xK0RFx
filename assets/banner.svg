<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1016"/>
      <stop offset="50%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#2ac3de"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7aa2f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2ac3de" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#7aa2f7" stroke-width="0.6" stroke-opacity="0.08"/>
    </pattern>
    <style>
      .hero-title {
        font-family: 'JetBrains Mono', 'Cascadia Code', 'Segoe UI', sans-serif;
        font-size: 68px;
        font-weight: 800;
        letter-spacing: 10px;
        fill: url(#neonText);
        filter: url(#neonGlow);
      }
      .hero-sub {
        font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
        font-size: 14px;
        letter-spacing: 4px;
        fill: #a9b1d6;
      }
      .hud-tag {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 11px;
        fill: #565f89;
        letter-spacing: 1.5px;
      }
      .hud-live {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 11px;
        fill: #9ece6a;
        letter-spacing: 1.5px;
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes slideBeam {
        0% { transform: translateX(0px); }
        100% { transform: translateX(410px); }
      }
      @keyframes floatOrb {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .dot-live { animation: pulseDot 2.2s ease-in-out infinite; fill: #9ece6a; }
      .beam { animation: slideBeam 5s ease-in-out infinite; }
      .orb1 { animation: floatOrb 6s ease-in-out infinite; }
      .orb2 { animation: floatOrb 8s ease-in-out infinite reverse; }
    </style>
  </defs>

  <!-- Base Card -->
  <rect x="2" y="2" width="896" height="216" rx="16" fill="url(#heroBg)" stroke="#292e42" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="216" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glowing Orbs -->
  <circle cx="150" cy="110" r="85" fill="#7aa2f7" opacity="0.08" filter="url(#neonGlow)" class="orb1"/>
  <circle cx="750" cy="110" r="95" fill="#bb9af7" opacity="0.08" filter="url(#neonGlow)" class="orb2"/>

  <!-- HUD Corner Brackets -->
  <path d="M 22 42 L 22 22 L 42 22" fill="none" stroke="#7aa2f7" stroke-width="2" opacity="0.7"/>
  <path d="M 878 42 L 878 22 L 858 22" fill="none" stroke="#2ac3de" stroke-width="2" opacity="0.7"/>
  <path d="M 22 178 L 22 198 L 42 198" fill="none" stroke="#2ac3de" stroke-width="2" opacity="0.7"/>
  <path d="M 878 178 L 878 198 L 858 198" fill="none" stroke="#7aa2f7" stroke-width="2" opacity="0.7"/>

  <!-- Top HUD Metadata -->
  <text x="52" y="34" class="hud-tag">SYS.ID // xK0RFx</text>
  <text x="848" y="34" text-anchor="end" class="hud-live"><tspan class="dot-live">●</tspan><tspan> ONLINE // BUILD READY</tspan></text>

  <!-- Center Title -->
  <text x="455" y="122" text-anchor="middle" class="hero-title">K0RF</text>

  <!-- Divider + Animated Light Beam -->
  <line x1="200" y1="145" x2="700" y2="145" stroke="url(#lineGrad)" stroke-width="1.5"/>
  <rect x="200" y="144" width="90" height="2.5" rx="1" fill="#2ac3de" opacity="0.85" class="beam"/>

  <!-- Subtitle -->
  <text x="450" y="174" text-anchor="middle" class="hero-sub">RUST  ·  PYTHON  ·  POWERSHELL  ·  WIN32</text>

  <!-- Bottom HUD Metadata -->
  <text x="52" y="196" class="hud-tag">ARCH: x86_64-pc-windows-msvc</text>
  <text x="848" y="196" text-anchor="end" class="hud-tag">TOKYO.NIGHT // v2026</text>
</svg>
