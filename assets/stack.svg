<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="barRust" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9e64"/>
      <stop offset="100%" stop-color="#f7768e"/>
    </linearGradient>
    <linearGradient id="barPy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#2ac3de"/>
    </linearGradient>
    <linearGradient id="barPs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>
    <style>
      .h {
        font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
        font-size: 14px;
        font-weight: 700;
        fill: #c0caf5;
      }
      .sub {
        font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
        font-size: 11.5px;
        fill: #787c99;
      }
      .lbl {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 12px;
        fill: #a9b1d6;
      }
      .pct {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 11.5px;
        fill: #565f89;
      }
      .pill {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 11px;
        fill: #c0caf5;
      }
      @keyframes eq1 { 0%, 100% { height: 10px; y: 34px; } 50% { height: 24px; y: 20px; } }
      @keyframes eq2 { 0%, 100% { height: 22px; y: 22px; } 50% { height: 8px;  y: 36px; } }
      @keyframes eq3 { 0%, 100% { height: 14px; y: 30px; } 50% { height: 26px; y: 18px; } }
      .b1 { animation: eq1 1.4s ease-in-out infinite; }
      .b2 { animation: eq2 1.1s ease-in-out infinite; }
      .b3 { animation: eq3 1.6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- CARD 1: Core Stack Bars -->
  <g transform="translate(2, 2)">
    <rect x="0" y="0" width="398" height="206" rx="14" fill="url(#cardBg)" stroke="#292e42" stroke-width="1.5"/>
    <text x="24" y="34" class="h" fill="#7aa2f7">// CORE TELEMETRY</text>
    <text x="374" y="34" text-anchor="end" class="sub">LOC &amp; FOCUS</text>

    <!-- Rust -->
    <text x="24" y="68" class="lbl">Rust (WinAPI / CLI / Native)</text>
    <text x="374" y="68" text-anchor="end" class="pct" fill="#ff9e64">PRIMARY</text>
    <rect x="24" y="76" width="350" height="8" rx="4" fill="#13141c"/>
    <rect x="24" y="76" width="315" height="8" rx="4" fill="url(#barRust)"/>

    <!-- Python -->
    <text x="24" y="114" class="lbl">Python (Backend / Automation)</text>
    <text x="374" y="114" text-anchor="end" class="pct" fill="#2ac3de">FAST PROTO</text>
    <rect x="24" y="122" width="350" height="8" rx="4" fill="#13141c"/>
    <rect x="24" y="122" width="245" height="8" rx="4" fill="url(#barPy)"/>

    <!-- PowerShell -->
    <text x="24" y="160" class="lbl">PowerShell &amp; Win32 Tooling</text>
    <text x="374" y="160" text-anchor="end" class="pct" fill="#bb9af7">SYSTEM</text>
    <rect x="24" y="168" width="350" height="8" rx="4" fill="#13141c"/>
    <rect x="24" y="168" width="200" height="8" rx="4" fill="url(#barPs)"/>
  </g>

  <!-- CARD 2: Architecture & Principles -->
  <g transform="translate(420, 2)">
    <rect x="0" y="0" width="398" height="206" rx="14" fill="url(#cardBg)" stroke="#292e42" stroke-width="1.5"/>
    <text x="24" y="34" class="h" fill="#bb9af7">// RUNTIME SPECS</text>

    <!-- Equalizer Animation top-right -->
    <rect x="346" y="34" width="4" height="10" rx="2" fill="#9ece6a" class="b1"/>
    <rect x="354" y="22" width="4" height="22" rx="2" fill="#2ac3de" class="b2"/>
    <rect x="362" y="30" width="4" height="14" rx="2" fill="#7aa2f7" class="b3"/>
    <rect x="370" y="22" width="4" height="22" rx="2" fill="#bb9af7" class="b1"/>

    <!-- Feature Grid -->
    <g transform="translate(24, 54)">
      <rect x="0" y="0" width="168" height="58" rx="8" fill="#13141c" stroke="#24283b" stroke-width="1"/>
      <text x="14" y="24" class="pill" fill="#ff9e64">▸ Zero-Bloat</text>
      <text x="14" y="42" class="sub">Без рантайма</text>

      <rect x="182" y="0" width="168" height="58" rx="8" fill="#13141c" stroke="#24283b" stroke-width="1"/>
      <text x="196" y="24" class="pill" fill="#2ac3de">▸ Win32 &amp; OCR</text>
      <text x="196" y="42" class="sub">Хуки и оверлеи</text>

      <rect x="0" y="72" width="168" height="58" rx="8" fill="#13141c" stroke="#24283b" stroke-width="1"/>
      <text x="14" y="96" class="pill" fill="#9ece6a">▸ Automation</text>
      <text x="14" y="114" class="sub">Скрипты и кодеки</text>

      <rect x="182" y="72" width="168" height="58" rx="8" fill="#13141c" stroke="#24283b" stroke-width="1"/>
      <text x="196" y="96" class="pill" fill="#bb9af7">▸ Low Latency</text>
      <text x="196" y="114" class="sub">LTO + async</text>
    </g>
  </g>
</svg>
