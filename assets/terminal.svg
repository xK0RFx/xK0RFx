<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2ac3de" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#2ac3de"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono {
        font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
        font-size: 13px;
      }
      .small {
        font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
        font-size: 11.5px;
      }
      .title {
        font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
        font-size: 12.5px;
        fill: #787c99;
      }
      .logo {
        font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
        font-size: 52px;
        font-weight: 800;
        letter-spacing: 5px;
        fill: url(#logoGrad);
        filter: url(#glow);
      }
      .key { fill: #7aa2f7; font-weight: 600; }
      .sep { fill: #565f89; }
      .val { fill: #c0caf5; }
      .acc { fill: #bb9af7; font-weight: 600; }
      .grn { fill: #9ece6a; font-weight: 600; }
      .cyn { fill: #2ac3de; }
      .ylw { fill: #e0af68; }
      .org { fill: #ff9e64; font-weight: 600; }
      .dim { fill: #565f89; }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes fadeIn1 {
        0%, 15% { opacity: 0; }
        25%, 100% { opacity: 1; }
      }
      @keyframes fadeIn2 {
        0%, 45% { opacity: 0; }
        55%, 100% { opacity: 1; }
      }
      @keyframes scanline {
        0% { transform: translateY(-440px); }
        100% { transform: translateY(440px); }
      }
      .step1 { animation: fadeIn1 7s ease-out infinite; }
      .step2 { animation: fadeIn2 7s ease-out infinite; }
      .cursor { animation: blink 1s step-end infinite; fill: #7aa2f7; }
      .scan { animation: scanline 10s linear infinite; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="816" height="436" rx="14" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Bar -->
  <path d="M 2 16 Q 2 2 16 2 L 804 2 Q 818 2 818 16 L 818 40 L 2 40 Z" fill="#13141c"/>
  <line x1="2" y1="40" x2="818" y2="40" stroke="#292e42" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6.5" fill="#f7768e"/>
  <circle cx="44" cy="21" r="6.5" fill="#e0af68"/>
  <circle cx="64" cy="21" r="6.5" fill="#9ece6a"/>

  <!-- Window Title -->
  <text x="410" y="25" text-anchor="middle" class="title">pwsh — k0rf@win11: ~/workspace</text>

  <!-- Prompt -->
  <text x="28" y="70" class="mono">
    <tspan class="grn">k0rf@win11</tspan><tspan class="sep">:</tspan><tspan class="key">~</tspan><tspan class="val">$ fastfetch</tspan>
  </text>

  <!-- LEFT COLUMN -->
  <g transform="translate(30, 108)">
    <text x="0" y="38" class="logo">K0RF</text>
    <text x="2" y="62" class="small dim">// native windows tooling</text>
    <line x1="0" y1="80" x2="250" y2="80" stroke="#292e42" stroke-width="1"/>

    <!-- Drawn crab -->
    <g transform="translate(2, 100)" fill="none" stroke="#ff9e64" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="44" cy="38" rx="27" ry="17" fill="#ff9e64" fill-opacity="0.14"/>
      <path d="M21 34 L8 26 M20 40 L4 42 M21 46 L10 54"/>
      <path d="M67 34 L80 26 M68 40 L84 42 M67 46 L78 54"/>
      <path d="M23 24 L12 13 L5 15 M12 13 L14 6"/>
      <path d="M65 24 L76 13 L83 15 M76 13 L74 6"/>
      <path d="M36 20 L36 25 M52 20 L52 25"/>
      <circle cx="36" cy="18" r="2.6" fill="#ff9e64" stroke="none"/>
      <circle cx="52" cy="18" r="2.6" fill="#ff9e64" stroke="none"/>
    </g>

    <text x="2" y="200" class="small">
      <tspan class="org">rustc + cargo</tspan>
      <tspan class="dim"> · zero-cost</tspan>
    </text>
    <text x="2" y="218" class="small dim">0 deps · 1 binary · fast</text>
  </g>

  <!-- RIGHT COLUMN -->
  <g transform="translate(400, 110)" class="mono">
    <text y="0"><tspan class="grn">k0rf</tspan><tspan class="sep">@</tspan><tspan class="grn">github</tspan></text>
    <line x1="0" y1="14" x2="380" y2="14" stroke="#292e42" stroke-width="1"/>

    <text y="40"><tspan class="key">OS</tspan><tspan class="sep">        :: </tspan><tspan class="val">Windows 11 Pro x86_64</tspan></text>
    <text y="62"><tspan class="key">Host</tspan><tspan class="sep">      :: </tspan><tspan class="val">K0RF Workstation</tspan></text>
    <text y="84"><tspan class="key">Shell</tspan><tspan class="sep">     :: </tspan><tspan class="val">PowerShell 7 / Git Bash</tspan></text>
    <text y="106"><tspan class="key">Primary</tspan><tspan class="sep">   :: </tspan><tspan class="org">Rust</tspan><tspan class="dim"> (WinAPI, async, GUI)</tspan></text>
    <text y="128"><tspan class="key">Scripting</tspan><tspan class="sep"> :: </tspan><tspan class="ylw">Python</tspan><tspan class="sep"> &amp; </tspan><tspan class="cyn">PowerShell</tspan></text>
    <text y="150"><tspan class="key">Focus</tspan><tspan class="sep">     :: </tspan><tspan class="val">Нативные утилиты</tspan></text>
    <text y="172"><tspan class="key">Style</tspan><tspan class="sep">     :: </tspan><tspan class="acc">Просто. Быстро. Нативно.</tspan></text>

    <!-- Palette -->
    <g transform="translate(0, 198)">
      <rect x="0"   y="0" width="24" height="14" rx="3" fill="#f7768e"/>
      <rect x="32"  y="0" width="24" height="14" rx="3" fill="#ff9e64"/>
      <rect x="64"  y="0" width="24" height="14" rx="3" fill="#e0af68"/>
      <rect x="96"  y="0" width="24" height="14" rx="3" fill="#9ece6a"/>
      <rect x="128" y="0" width="24" height="14" rx="3" fill="#2ac3de"/>
      <rect x="160" y="0" width="24" height="14" rx="3" fill="#7aa2f7"/>
      <rect x="192" y="0" width="24" height="14" rx="3" fill="#bb9af7"/>
      <rect x="224" y="0" width="24" height="14" rx="3" fill="#c0caf5"/>
    </g>
  </g>

  <!-- Divider -->
  <line x1="30" y1="356" x2="790" y2="356" stroke="#292e42" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Build Output -->
  <g transform="translate(30, 382)" class="mono">
    <text y="0">
      <tspan class="grn">k0rf@win11</tspan><tspan class="sep">:</tspan><tspan class="key">~/workspace</tspan><tspan class="val">$ cargo build --release</tspan>
    </text>
    <text y="22" class="step1">
      <tspan class="cyn">   Compiling</tspan><tspan class="val"> core_engine v0.9.4 (win32-x64)</tspan>
    </text>
    <text y="44" class="step2">
      <tspan class="grn">    Finished</tspan><tspan class="val"> `release` [optimized + lto] in 0.38s</tspan>
      <tspan class="sep">  ──  </tspan><tspan class="acc">READY</tspan>
    </text>
    <rect x="560" y="32" width="8" height="15" class="cursor"/>
  </g>

  <!-- Scanline Overlay -->
  <rect x="2" y="40" width="816" height="2" fill="#7aa2f7" opacity="0.08" class="scan"/>
</svg>
