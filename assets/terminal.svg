<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2ac3de" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#2ac3de"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .mono {
        font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
        font-size: 13.5px;
      }
      .title {
        font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
        font-size: 12.5px;
        fill: #787c99;
      }
      .ascii {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 13px;
        font-weight: 700;
        fill: url(#logoGrad);
        filter: url(#glow);
        animation: pulse 4s ease-in-out infinite;
      }
      .key { fill: #7aa2f7; font-weight: 600; }
      .sep { fill: #565f89; }
      .val { fill: #c0caf5; }
      .acc { fill: #bb9af7; font-weight: 600; }
      .grn { fill: #9ece6a; font-weight: 600; }
      .cyn { fill: #2ac3de; }
      .ylw { fill: #e0af68; }
      .org { fill: #ff9e64; font-weight: 600; }
      .dim { fill: #565f89; }

      @keyframes pulse {
        0%, 100% { opacity: 0.92; }
        50% { opacity: 1; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes fadeIn1 {
        0%, 15% { opacity: 0; transform: translateY(3px); }
        25%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn2 {
        0%, 38% { opacity: 0; transform: translateY(3px); }
        48%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn3 {
        0%, 62% { opacity: 0; transform: translateY(3px); }
        72%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes scanline {
        0% { transform: translateY(-420px); }
        100% { transform: translateY(420px); }
      }
      .step1 { animation: fadeIn1 8s ease-out infinite; }
      .step2 { animation: fadeIn2 8s ease-out infinite; }
      .step3 { animation: fadeIn3 8s ease-out infinite; }
      .cursor { animation: blink 1s step-end infinite; fill: #7aa2f7; }
      .scan { animation: scanline 9s linear infinite; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="816" height="416" rx="14" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Bar -->
  <path d="M 2 16 Q 2 2 16 2 L 804 2 Q 818 2 818 16 L 818 40 L 2 40 Z" fill="#13141c"/>
  <line x1="2" y1="40" x2="818" y2="40" stroke="#292e42" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6.5" fill="#f7768e"/>
  <circle cx="44" cy="21" r="6.5" fill="#e0af68"/>
  <circle cx="64" cy="21" r="6.5" fill="#9ece6a"/>

  <!-- Window Title -->
  <text x="410" y="25" text-anchor="middle" class="title">pwsh — k0rf@win11: ~/workspace</text>

  <!-- Prompt 1: fastfetch -->
  <text x="28" y="70" class="mono">
    <tspan class="grn">k0rf@win11</tspan><tspan class="sep">:</tspan><tspan class="key">~</tspan><tspan class="val">$ fastfetch</tspan>
  </text>

  <!-- ASCII Art Column -->
  <g transform="translate(28, 102)" xml:space="preserve">
    <text y="0"   class="ascii">  ██╗  ██╗ ██████╗ ██████╗ ███████╗</text>
    <text y="18"  class="ascii">  ██║ ██╔╝██╔═████╗██╔══██╗██╔════╝</text>
    <text y="36"  class="ascii">  █████╔╝ ██║██╔██║██████╔╝█████╗  </text>
    <text y="54"  class="ascii">  ██╔═██╗ ████╔╝██║██╔══██╗██╔══╝  </text>
    <text y="72"  class="ascii">  ██║  ██╗╚██████╔╝██║  ██║██║     </text>
    <text y="90"  class="ascii">  ╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═╝╚═╝     </text>
    <text y="122" class="mono dim">   ───────────────────────────────</text>
    <text y="144" class="mono"><tspan class="org">     _~^~^~_   </tspan><tspan class="dim">rustc + cargo</tspan></text>
    <text y="162" class="mono"><tspan class="org"> \) /  o o  \ (/</tspan><tspan class="dim">  zero-cost</tspan></text>
    <text y="180" class="mono"><tspan class="org">   '_   -   _'  </tspan><tspan class="dim">abstractions</tspan></text>
    <text y="198" class="mono"><tspan class="org">   / '-----' \  </tspan></text>
  </g>

  <!-- Fastfetch Info Column -->
  <g transform="translate(365, 100)" class="mono">
    <text y="0"><tspan class="grn">k0rf</tspan><tspan class="sep">@</tspan><tspan class="grn">github</tspan></text>
    <text y="16" class="dim">────────────────────────────────────────</text>

    <text y="38"><tspan class="key">OS</tspan><tspan class="sep">        :: </tspan><tspan class="val">Windows 11 Pro x86_64</tspan></text>
    <text y="60"><tspan class="key">Host</tspan><tspan class="sep">      :: </tspan><tspan class="val">K0RF Workstation</tspan></text>
    <text y="82"><tspan class="key">Shell</tspan><tspan class="sep">     :: </tspan><tspan class="val">PowerShell 7 / Git Bash</tspan></text>
    <text y="104"><tspan class="key">Primary</tspan><tspan class="sep">   :: </tspan><tspan class="org">Rust 🦀</tspan><tspan class="dim"> (WinAPI, async, CLI, GUI)</tspan></text>
    <text y="126"><tspan class="key">Scripting</tspan><tspan class="sep"> :: </tspan><tspan class="ylw">Python</tspan><tspan class="sep"> &amp; </tspan><tspan class="cyn">PowerShell</tspan></text>
    <text y="148"><tspan class="key">Focus</tspan><tspan class="sep">     :: </tspan><tspan class="val">Нативные утилиты, автоматизация</tspan></text>
    <text y="170"><tspan class="key">Philosophy</tspan><tspan class="sep">:: </tspan><tspan class="acc">Минимум зависимостей, максимум скорости</tspan></text>

    <!-- Color Palette Pills -->
    <g transform="translate(0, 192)">
      <rect x="0"   y="0" width="24" height="14" rx="3" fill="#f7768e"/>
      <rect x="32"  y="0" width="24" height="14" rx="3" fill="#ff9e64"/>
      <rect x="64"  y="0" width="24" height="14" rx="3" fill="#e0af68"/>
      <rect x="96"  y="0" width="24" height="14" rx="3" fill="#9ece6a"/>
      <rect x="128" y="0" width="24" height="14" rx="3" fill="#2ac3de"/>
      <rect x="160" y="0" width="24" height="14" rx="3" fill="#7aa2f7"/>
      <rect x="192" y="0" width="24" height="14" rx="3" fill="#bb9af7"/>
      <rect x="224" y="0" width="24" height="14" rx="3" fill="#c0caf5"/>
    </g>
  </g>

  <!-- Divider -->
  <line x1="28" y1="322" x2="792" y2="322" stroke="#292e42" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Animated Cargo Build Output -->
  <g transform="translate(28, 348)" class="mono">
    <text y="0">
      <tspan class="grn">k0rf@win11</tspan><tspan class="sep">:</tspan><tspan class="key">~/workspace</tspan><tspan class="val">$ cargo build --release</tspan>
    </text>
    <text y="22" class="step1">
      <tspan class="cyn">   Compiling</tspan><tspan class="val"> core_engine v0.9.4 (win32-x64)</tspan>
    </text>
    <text y="44" class="step2">
      <tspan class="grn">    Finished</tspan><tspan class="val"> `release` profile [optimized + lto] target(s) in 0.38s</tspan>
      <tspan class="step3"><tspan class="sep">  ──  </tspan><tspan class="acc">READY</tspan></tspan>
    </text>
    <rect x="595" y="32" width="8" height="15" class="cursor"/>
  </g>

  <!-- Subtle Scanline Overlay -->
  <rect x="2" y="40" width="816" height="2" fill="#7aa2f7" opacity="0.08" class="scan"/>
</svg>
